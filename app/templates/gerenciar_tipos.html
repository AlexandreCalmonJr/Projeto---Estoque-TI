{% extends 'base.html' %}
{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Gerenciar Categorias -->
    <div class="bg-white p-6 rounded-lg shadow-md">
        <h3 class="text-xl font-bold mb-4">Categorias</h3>
        <form method="POST" action="{{ url_for('main.gerenciar_tipos') }}" class="mb-4">

            <input type="hidden" name="form_type" value="categoria">
            <input type="text" name="nome" placeholder="Nova Categoria" class="w-full border p-2 rounded mb-2" required>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Adicionar Categoria</button>
        </form>
        <ul class="list-disc pl-5">
            {% for cat in categorias %}
            <li>{{ cat.nome }}</li>
            {% endfor %}
        </ul>
    </div>
    
    <!-- Gerenciar Modelos -->
    <div class="bg-white p-6 rounded-lg shadow-md">
        <h3 class="text-xl font-bold mb-4">Modelos</h3>
        <form method="POST" action="{{ url_for('main.gerenciar_tipos') }}" class="mb-4">

            <input type="hidden" name="form_type" value="modelo">
            <select name="categoria_id" class="w-full border p-2 rounded mb-2" required>
                <option value="">Selecione a Categoria</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}">{{ cat.nome }}</option>
                {% endfor %}
            </select>
            <input type="text" name="nome" placeholder="Novo Modelo (ex: Latitude 5440)" class="w-full border p-2 rounded mb-2" required>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Adicionar Modelo</button>
        </form>
    </div>
</div>
{% endblock %}

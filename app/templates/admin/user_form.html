{% extends 'admin/base_admin.html' %}
{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1">Nome de Usuário</label>
            <input type="text" name="username" value="{{ user.username }}" class="w-full border p-2 rounded" required>
        </div>
        <div class="mb-4">
            <label class="block mb-1">Nova Senha (deixe em branco para não alterar)</label>
            <input type="password" name="password" class="w-full border p-2 rounded">
        </div>
        <div class="mb-4">
            <label class="flex items-center">
                <input type="checkbox" name="is_admin" class="mr-2" {% if user.is_admin %}checked{% endif %}>
                É Administrador?
            </label>
        </div>
        <div class="flex justify-between items-center">
            <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Salvar Alterações</button>
    </form>
    <form action="{{ url_for('admin.delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('Tem certeza que deseja deletar este usuário?');">
        <button type="submit" class="bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700">Deletar Usuário</button>
    </form>
</div>
{% endblock %}

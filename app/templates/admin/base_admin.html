<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white p-6 flex flex-col">
            <div>
                <h1 class="text-2xl font-bold mb-8">ADMINISTRAÇÃO</h1>
                <nav>
                    <a href="{{ url_for('admin.dashboard') }}" class="block py-2 px-4 rounded hover:bg-gray-700">Visão Geral</a>
                    <a href="{{ url_for('admin.list_users') }}" class="block py-2 px-4 rounded hover:bg-gray-700">Usuários</a>
                </nav>
            </div>
            <div class="mt-auto">
                <a href="{{ url_for('main.index') }}" class="block text-center w-full mt-4 py-2 px-4 rounded bg-blue-600 hover:bg-blue-700">Voltar ao Sistema</a>
            </div>
        </aside>
        <main class="flex-1 p-8 overflow-y-auto">
            <h2 class="text-3xl font-semibold text-gray-800 mb-6">{{ title }}</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-4 mb-4 text-sm rounded-lg
                            {% if category == 'success' %} bg-green-100 text-green-800
                            {% elif category == 'error' %} bg-red-100 text-red-800
                            {% else %} bg-blue-100 text-blue-800 {% endif %}"
                            role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>

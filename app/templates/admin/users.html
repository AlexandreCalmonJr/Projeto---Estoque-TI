{% extends 'admin/base_admin.html' %}
{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
    <table class="w-full text-left">
        <thead>
            <tr>
                <th class="p-3">ID</th>
                <th class="p-3">Usuário</th>
                <th class="p-3">Admin?</th>
                <th class="p-3">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr class="border-b">
                <td class="p-3">{{ user.id }}</td>
                <td class="p-3">{{ user.username }}</td>
                <td class="p-3">{% if user.is_admin %}Sim{% else %}Não{% endif %}</td>
                <td class="p-3">
                    <a href="{{ url_for('admin.edit_user', user_id=user.id) }}" class="text-blue-600 hover:underline">Editar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

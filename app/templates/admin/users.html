{% extends 'admin/base_admin.html' %}
{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">Usuários do Sistema</h3>
        <a href="{{ url_for('admin.create_user') }}" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
            Criar Novo Usuário
        </a>
    </div>
    <table class="w-full text-left">
        <thead class="bg-gray-100">
            <tr>
                <th class="p-3 font-bold">ID</th>
                <th class="p-3 font-bold">Usuário</th>
                <th class="p-3 font-bold">Nível de Acesso</th>
                <th class="p-3 font-bold">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr class="border-b hover:bg-gray-50">
                <td class="p-3">{{ user.id }}</td>
                <td class="p-3">{{ user.username }}</td>
                <td class="p-3">
                    {% if user.is_admin %}
                        <span class="px-2 py-1 font-semibold leading-tight text-green-700 bg-green-100 rounded-full">Admin</span>
                    {% else %}
                        <span class="px-2 py-1 font-semibold leading-tight text-yellow-700 bg-yellow-100 rounded-full">Básico</span>
                    {% endif %}
                </td>
                <td class="p-3">
                    <a href="{{ url_for('admin.edit_user', user_id=user.id) }}" class="text-blue-600 hover:underline">Editar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
